[project]
name = "neolook-mcp-server"
version = "0.1.0"
description = "A Python MCP server for Shopify with analytics and agentic commerce tools"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.2.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "cachetools>=5.5.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.9.0",
    "rich>=13.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
]

[project.scripts]
neolook-server = "neolook.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/neolook"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
